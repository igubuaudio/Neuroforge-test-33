
name: Build Windows VST3

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -S . -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release --target Neuroforge_VST3

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: Neuroforge-Windows-VST3
          path: build/Neuroforge_artefacts/Release/VST3/Neuroforge.vst3
